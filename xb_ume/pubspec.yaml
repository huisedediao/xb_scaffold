name: xb_ume
description: Pure Flutter in-app debug toolkit inspired by flutter_ume, including console, route, performance, memory, network, inspector, device and storage panels.
version: 0.8.0
homepage: https://github.com/huisedediao/xb_scaffold/tree/main/xb_ume
repository: https://github.com/huisedediao/xb_scaffold/tree/main/xb_ume
issue_tracker: https://github.com/huisedediao/xb_scaffold/issues
topics:
  - flutter
  - debug
  - ume
  - inspector

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.12.0'

executables:
  # 全局 activate 后可用 `xb_ume run <场景> --uri <端口>`（bin/run.dart）。
  xb_ume: run
  # 全局 activate 后可用 `xb_ume_mcp`（bin/mcp.dart）作为 MCP 服务。
  xb_ume_mcp: mcp
  # 全局 activate 后可用 `xb_ume_ai`（bin/ai.dart）：一键准备 AI 调试模式。
  xb_ume_ai: ai

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
